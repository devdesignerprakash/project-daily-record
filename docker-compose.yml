services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    ports:
      - 27017:27017

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      MONGO_URI: "mongodb://root:example@mongo:27017/?authSource=admin"
      JWT_SECRET: supersecretjwt
      ADMIN_EMAIL: vftcteku@gmail.com
      ADMIN_PASSWORD: P@ssw0rd
      # Cookies are served over plain HTTP on the LAN — leave unset/false.
      # Set to "true" only once this is deployed behind real HTTPS.
      COOKIE_SECURE: "false"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = call the API via a relative "/api/..." path, which nginx
        # proxies to the backend. This makes the build work from ANY LAN
        # client address instead of baking in one fixed host/port.
        NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3001:80"
    depends_on:
      - frontend
      - backend

volumes:
  mongo-data:
